name: Refresh and save instructor data

on:
  schedule:
    # 10:23 UTC daily. PAUSE_CATALOG_REFRESH=true pauses collection.
    - cron: "23 10 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-catalog.yml
      - data/bootstrap/durable_state.py
  workflow_dispatch:
    inputs:
      term:
        description: Upcoming OSU term code
        required: true
        default: "1272"
      history_term:
        description: Build-only instructor-history term (classes stay hidden from the app)
        required: true
        default: "1268"
      campuses:
        description: ALL or comma-separated OSU campus codes
        required: true
        default: ALL
      discovery_minutes:
        description: Instructor-search budget in minutes (0 processes the full pending queue)
        required: true
        default: "20"
      refresh_history:
        description: Refresh build-only instructor history now (otherwise weekly or when missing)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: catalog-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch && vars.PAUSE_CATALOG_REFRESH != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      IMPORT_TERM: ${{ inputs.term || '1272' }}
      HISTORY_TERM: ${{ inputs.history_term || '1268' }}
      IMPORT_CAMPUSES: ${{ inputs.campuses || 'ALL' }}
      DISCOVERY_MINUTES: ${{ inputs.discovery_minutes || (github.event_name == 'push' && '2') || '20' }}
      REFRESH_HISTORY: ${{ inputs.refresh_history && 'true' || 'false' }}
      EVENT_NAME: ${{ github.event_name }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate refresh inputs
        run: |
          python3 - <<'PY'
          import math
          import os
          import re
          for key in ("IMPORT_TERM", "HISTORY_TERM"):
              if not re.fullmatch(r"\d{4}", os.environ[key]):
                  raise SystemExit(f"{key} must be a four-digit OSU term code")
          campuses = os.environ["IMPORT_CAMPUSES"]
          if campuses != "ALL" and not re.fullmatch(r"[a-z]{2,10}(,[a-z]{2,10})*", campuses):
              raise SystemExit("Campuses must be ALL or comma-separated lowercase campus codes")
          minutes = float(os.environ["DISCOVERY_MINUTES"])
          if not math.isfinite(minutes) or minutes < 0:
              raise SystemExit("Discovery minutes must be a finite nonnegative number")
          PY
      - name: Restore previous checked collection and instructor-search progress
        id: university-cache
        uses: actions/cache/restore@v4
        with:
          path: artifacts/university
          key: university-v1-${{ runner.os }}-${{ github.ref_name }}-${{ env.IMPORT_TERM }}-${{ env.HISTORY_TERM }}-${{ env.IMPORT_CAMPUSES }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            university-v1-${{ runner.os }}-${{ github.ref_name }}-${{ env.IMPORT_TERM }}-${{ env.HISTORY_TERM }}-${{ env.IMPORT_CAMPUSES }}-
      - name: Verify collection, publication, and resume logic
        run: python3 -m unittest discover -s data/bootstrap -p 'test_*.py'
      - name: Verify Java importer
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Restore durable instructor results and checked search progress
        run: python3 data/bootstrap/durable_state.py restore
      - name: Refresh official CSE roster and reviewed surname seeds
        run: >-
          python3 data/bootstrap/update_cse_roster.py
          --catalog artifacts/university/catalog.json
          --max-surnames=2000
      - name: Collect all offered classes and resume instructor searches
        run: |
          refresh_args=(
            --term "$IMPORT_TERM"
            --history-term "$HISTORY_TERM"
            --campuses "$IMPORT_CAMPUSES"
            --work-dir artifacts/university
            --output-dir frontend/public/data
            --discover
            --discovery-minutes "$DISCOVERY_MINUTES"
          )
          # Configuration pushes prove durable publication promptly using the
          # verified saved inventory. Daily/manual runs also recollect all classes.
          if [ "$EVENT_NAME" = "push" ]; then
            refresh_args+=(--skip-base)
          fi
          if [ "$REFRESH_HISTORY" = "true" ] || { [ "$EVENT_NAME" = "schedule" ] && [ "$(date -u +%u)" = "7" ]; }; then
            refresh_args+=(--refresh-history)
          fi
          python3 data/bootstrap/refresh_university.py "${refresh_args[@]}"
      - name: Verify and build refreshed site
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Prepare durable search state and public refresh status
        run: python3 data/bootstrap/durable_state.py save
      - name: Save verified instructor data back to the repository
        env:
          SAVE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- frontend/public/data data/discovery/refresh-state data/discovery/cse-instructor-identities.json data/discovery/cse-surnames.txt data/discovery/cse-directory-collection.json
          if git diff --cached --quiet; then
            echo 'No saved data changed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m 'Refresh upcoming course instructors and saved search progress'
          git fetch origin "$SAVE_BRANCH"
          git rebase "origin/$SAVE_BRANCH"
          git push origin "HEAD:$SAVE_BRANCH"
          echo 'Verified instructor data and search progress saved permanently in the repository.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save checked collection and resumable instructor-search progress
        uses: actions/cache/save@v4
        with:
          path: artifacts/university
          key: ${{ steps.university-cache.outputs.cache-primary-key }}
      - name: Preserve successful snapshot, search receipts, and site for review
        uses: actions/upload-artifact@v4
        with:
          name: refreshed-catalog-and-site
          path: |
            frontend/public/data
            frontend/dist
            artifacts/university/collection.json
            artifacts/university/discovery-state.json
            data/discovery/refresh-state
            data/discovery/cse-instructor-identities.json
            data/discovery/cse-surnames.txt
            data/discovery/cse-directory-collection.json
          retention-days: 7
      - name: Check optional publishing configuration
        id: publishing
        env:
          ENABLE_DEPLOY: ${{ vars.ENABLE_CLOUDFLARE_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
        run: |
          if [ "$ENABLE_DEPLOY" = "true" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'Build passed. Configured Cloudflare publication will run next.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Build passed. Publication is disabled; download the workflow artifact to review it.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish the verified site to Cloudflare Pages
        if: steps.publishing.outputs.enabled == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: >-
          npx --yes wrangler@4 pages deploy frontend/dist
          --project-name="$CLOUDFLARE_PROJECT_NAME"
          --branch="$DEPLOY_BRANCH"
          --commit-dirty=true
