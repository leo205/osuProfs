spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/osuprofs}
    username: ${DATABASE_USERNAME:osuprofs}
    password: ${DATABASE_PASSWORD:osuprofs}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
